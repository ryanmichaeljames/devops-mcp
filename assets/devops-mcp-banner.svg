<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<rect width="100%" height="100%" fill="#09090b"/>
<defs>
  <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
    <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#111114" stroke-width="1"/>
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)"/>

<g font-family="DejaVu Sans Mono, monospace">
  <rect x="95" y="88" width="7" height="42" fill="#e11d2e"/>
  <text x="117" y="112" font-size="21" fill="#8b8b91" letter-spacing="1">OPEN-SOURCE MCP SERVER</text>

  <text x="95" y="238" font-family="DejaVu Sans, sans-serif" font-size="102" font-weight="700" fill="#f5f5f4">DEVOPS</text>
  <text x="95" y="348" font-family="DejaVu Sans, sans-serif" font-size="102" font-weight="700" fill="#f5f5f4">MCP</text>

  <rect x="95" y="370" width="248" height="9" rx="4" fill="#e11d2e"/>
  <text x="95" y="428" font-size="25" fill="#8b8b91">AI AGENTS  ↔  AZURE DEVOPS</text>

  <g transform="translate(980 120)">

    <!-- git graph: trunk runs newest (top) to oldest (bottom); every branch
         leaves a commit and merges into a commit, sprouts grey, merges red -->
    <g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M96 238 C66 238 30 236 30 206 L30 124" stroke="#8b8b91"/>
      <path d="M30 124 C30 78 46 40 96 40" stroke="#e11d2e"/>
      <path d="M96 172 C126 172 148 168 148 144" stroke="#8b8b91"/>
      <path d="M148 144 C148 122 128 106 96 106" stroke="#e11d2e"/>
      <line x1="96" y1="40" x2="96" y2="238" stroke="#f5f5f4"/>
    </g>

    <g fill="#09090b" stroke-width="4">
      <circle cx="96" cy="106" r="8" stroke="#f5f5f4"/>
      <circle cx="96" cy="172" r="8" stroke="#f5f5f4"/>
      <circle cx="96" cy="238" r="8" stroke="#f5f5f4"/>
      <circle cx="30" cy="190" r="6.5" stroke="#8b8b91" stroke-width="3.5"/>
      <circle cx="30" cy="124" r="6.5" stroke="#8b8b91" stroke-width="3.5"/>
      <circle cx="148" cy="144" r="6.5" stroke="#8b8b91" stroke-width="3.5"/>
    </g>
    <circle cx="96" cy="40" r="9" fill="#7f101a" stroke="#e11d2e" stroke-width="4"/>

    <!-- the merge at HEAD triggers the pipeline -->
    <line x1="114" y1="40" x2="222" y2="40" stroke="#e11d2e" stroke-width="3"/>
    <path d="M232 40 L221 34.5 L221 45.5 Z" fill="#e11d2e"/>

    <!-- pipeline: two stages green-lit, one running, one still queued -->
    <g stroke-width="3">
      <line x1="304" y1="62" x2="304" y2="86" stroke="#45454e"/>
      <path d="M304 90 L299 81 L309 81 Z" fill="#45454e" stroke="none"/>
      <line x1="304" y1="132" x2="304" y2="156" stroke="#e11d2e"/>
      <path d="M304 160 L299 151 L309 151 Z" fill="#e11d2e" stroke="none"/>
      <line x1="304" y1="202" x2="304" y2="226" stroke="#26262c"/>
      <path d="M304 230 L299 221 L309 221 Z" fill="#26262c" stroke="none"/>
    </g>

    <g fill="#0d0d10" stroke-width="2.5">
      <rect x="244" y="18" width="120" height="44" rx="9" stroke="#33333b"/>
      <rect x="244" y="88" width="120" height="44" rx="9" stroke="#33333b"/>
      <rect x="244" y="158" width="120" height="44" rx="9" stroke="#e11d2e"/>
      <rect x="244" y="228" width="120" height="44" rx="9" stroke="#1e1e23"/>
    </g>
    <rect x="244" y="158" width="120" height="44" rx="9" fill="none"
          stroke="#e11d2e" stroke-width="9" opacity="0.16"/>

    <g fill="none" stroke="#f5f5f4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="268" cy="40" r="9"/>
      <path d="M263.5 40 L267 43.5 L273 36.5"/>
      <circle cx="268" cy="110" r="9"/>
      <path d="M263.5 110 L267 113.5 L273 106.5"/>
    </g>
    <circle cx="268" cy="180" r="9" fill="#7f101a" stroke="#e11d2e" stroke-width="2.5"/>
    <circle cx="268" cy="180" r="3.5" fill="#e11d2e"/>
    <circle cx="268" cy="250" r="9" fill="none" stroke="#3f3f46" stroke-width="2.5" stroke-dasharray="3.2 3.4"/>

    <g>
      <rect x="288" y="33" width="56" height="6" rx="3" fill="#45454e"/>
      <rect x="288" y="45" width="36" height="6" rx="3" fill="#2f2f36"/>
      <rect x="288" y="103" width="56" height="6" rx="3" fill="#45454e"/>
      <rect x="288" y="115" width="36" height="6" rx="3" fill="#2f2f36"/>
      <rect x="288" y="173" width="56" height="6" rx="3" fill="#a1a1a8"/>
      <rect x="288" y="185" width="36" height="6" rx="3" fill="#45454e"/>
      <rect x="288" y="243" width="56" height="6" rx="3" fill="#26262c"/>
      <rect x="288" y="255" width="36" height="6" rx="3" fill="#1c1c21"/>
    </g>
  </g>

  <text x="1004" y="428" font-size="16" fill="#8b8b91">PIPELINES  •  REPOS  •  PULL REQUESTS  •  WORK ITEMS</text>
</g>

<g stroke="#25252a" stroke-width="2" fill="none">
  <path d="M62 126 V62 H210"/>
  <path d="M1538 374 V438 H1390"/>
</g>

<g stroke="#e11d2e" stroke-width="3">
  <line x1="40" y1="32" x2="40" y2="58"/>
  <line x1="780" y1="32" x2="780" y2="58"/>
  <line x1="1260" y1="32" x2="1260" y2="58"/>
  <line x1="1558" y1="32" x2="1558" y2="58"/>
  <line x1="1534" y1="78" x2="1560" y2="78"/>
  <line x1="1534" y1="422" x2="1560" y2="422"/>
</g>
</svg>