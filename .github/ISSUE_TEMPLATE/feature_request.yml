name: Feature request
description: Request a new tool, or a change to an existing one
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Only the first two fields are required.

        Requesting a **new tool**? Name the Azure DevOps REST API endpoint if you know it (for example `POST /wit/workitems/$Task`), and the rest is optional.

  - type: textarea
    id: goal
    attributes:
      label: What do you want to do?
      description: The task you are trying to accomplish, not the implementation you have in mind. If it maps to a specific Azure DevOps REST endpoint, name it.
      placeholder: |
        Re-run a failed stage of a pipeline without queueing the whole pipeline again. There is no tool for this today.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: The workaround you use now, or why there isn't one.
      placeholder: |
        I leave the agent and do it in the Azure DevOps web UI.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pipelines
        - Repos
        - Pull requests
        - Work items
        - Server behaviour or configuration
        - Documentation
        - Other

  - type: input
    id: tool
    attributes:
      label: Existing tool
      description: If this changes a tool that already exists, name it.
      placeholder: devops_list_pipelines

  - type: dropdown
    id: access
    attributes:
      label: Does it write to Azure DevOps?
      description: Write and delete tools register only behind AZDO_ALLOW_WRITE / AZDO_ALLOW_DELETE.
      options:
        - Read-only
        - Creates or updates data
        - Deletes data
        - Not sure

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Links to Microsoft's REST API documentation, example payloads, or the shape of the response you would expect back.
